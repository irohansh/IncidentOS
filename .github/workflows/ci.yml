name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check (API + orchestrator)
        run: npm run build:api

      - name: Unit tests (safety filters, SSRF guard, webhook validation)
        run: npm test

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true
